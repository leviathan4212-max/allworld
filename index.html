<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
:root {
  --marble-base:   #f5f1e8;
  --marble-1:      #faf7f1;
  --marble-2:      #f0ebe0;
  --marble-deep:   #2a251e;
  --ink:     #2a251e;
  --ink-2:   #4a4237;
  --muted:   #857a6a;
  --muted-2: #a59a8a;
  --gold:        #b8935a;
  --gold-light:  #e0c088;
  --gold-bright: #f0d68a;
  --gold-dark:   #8a6d3e;
  --gold-deep:   #6b5230;
  --line:   #d8cfbe;
  --line-2: #c8bca6;
  --shadow-sm: 0 2px 6px rgba(80,65,40,0.08);
  --shadow:    0 8px 24px rgba(80,65,40,0.12);
  --shadow-lg: 0 20px 50px rgba(40,30,15,0.22);
  --rank-凡人: #a09889;
  --rank-精锐: #7a9e6e;
  --rank-勇者: #5d8290;
  --rank-英雄: #8a6da5;
  --rank-半神: #c9945a;
  --rank-神祇: #b85d5d;
  --q-普通: #a09889;
  --q-精良: #6b9b5c;
  --q-稀有: #4a7a9b;
  --q-史诗: #7c5cc4;
  --q-传说: #c9945a;
  --q-神话: #b85d5d;
  --res-hp: #b85d5d;
  --res-mp: #4a7a9b;
  --res-sp: #6b9b5c;
  --res-san: #8a6da5;
  --sex-male:   #5d8290;
  --sex-female: #b85d7d;
  --sex-other:  #8a6da5;
}
.marble {
  background-color: var(--marble-base);
  background-image:
    repeating-linear-gradient(115deg,
      transparent 0px, transparent 45px,
      rgba(160,150,130,0.05) 45px, rgba(160,150,130,0.05) 47px,
      transparent 47px, transparent 110px),
    radial-gradient(ellipse 800px 260px at 15% 25%, rgba(190,180,160,0.28), transparent 62%),
    radial-gradient(ellipse 620px 380px at 85% 60%, rgba(170,160,140,0.22), transparent 58%),
    radial-gradient(ellipse 520px 340px at 42% 88%, rgba(200,190,170,0.25), transparent 60%),
    linear-gradient(135deg, #faf7f1 0%, #f0ebe0 55%, #ebe4d6 100%);
}
.marble-deep {
  background-color: var(--marble-deep);
  background-image:
    repeating-linear-gradient(115deg,
      transparent 0px, transparent 60px,
      rgba(224,192,136,0.06) 60px, rgba(224,192,136,0.06) 62px,
      transparent 62px, transparent 130px),
    radial-gradient(ellipse 700px 200px at 20% 50%, rgba(224,192,136,0.12), transparent 65%),
    radial-gradient(ellipse 500px 260px at 82% 45%, rgba(224,192,136,0.09), transparent 60%),
    linear-gradient(135deg, #2a251e 0%, #3a332a 55%, #2a251e 100%);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: transparent;
  color: var(--ink);
  font-family: 'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
  font-size: 13px;
  padding: 8px;
}
.serif { font-family: 'Georgia','Noto Serif SC','Songti SC',serif; letter-spacing: 0.5px; }

#tower-panel {
  position: relative;
  max-width: 640px;
  margin: 0 auto;
  border-radius: 10px;
  border: 1px solid var(--gold-dark);
  box-shadow: 0 0 0 1px var(--gold-light), var(--shadow-lg);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
#tower-panel::before, #tower-panel::after {
  content: ''; position: absolute; width: 22px; height: 22px;
  border: 1px solid var(--gold); pointer-events: none; z-index: 5; opacity: 0.7;
}
#tower-panel::before { top: 7px; left: 7px; border-right: none; border-bottom: none; }
#tower-panel::after  { bottom: 7px; right: 7px; border-left: none; border-top: none; }

#worldbar {
  padding: 12px 18px; color: var(--gold-light); font-size: 11.5px;
  letter-spacing: 1px; display: flex; flex-wrap: wrap; align-items: center;
  border-bottom: 1px solid var(--gold-dark); position: relative;
  font-family: 'Georgia','Noto Serif SC',serif;
  gap: 4px 0;
}
#worldbar::after {
  content: ''; position: absolute; bottom: -3px; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
}
.world-item {
  display: inline-flex; align-items: center; gap: 5px; padding: 0 12px;
  position: relative; text-shadow: 0 1px 2px rgba(0,0,0,0.4);
}
.world-item + .world-item::before {
  content: ''; position: absolute; left: 0; top: 50%; width: 1px; height: 10px;
  background: linear-gradient(180deg, transparent, var(--gold-dark), transparent);
  transform: translateY(-50%);
}
.world-item.rest { color: #f0c896; }

.news-entry-btn {
  margin-left: auto;
  background: transparent;
  border: 1px solid var(--gold-dark);
  color: var(--gold-light);
  width: 26px; height: 26px;
  border-radius: 3px; cursor: pointer;
  font-size: 14px; line-height: 1;
  display: inline-flex; align-items: center; justify-content: center;
  transition: all 0.15s ease;
  padding: 0;
  flex-shrink: 0;
}
.news-entry-btn:hover {
  border-color: var(--gold);
  background: rgba(224,192,136,0.15);
  transform: translateY(-1px);
  box-shadow: 0 2px 6px rgba(0,0,0,0.3);
}

#main { padding: 18px; display: flex; flex-direction: column; gap: 14px; }

.reincarnator-card {
  border-radius: 6px; padding: 16px 18px;
  border: 1px solid var(--gold-light);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.6), var(--shadow-sm);
  position: relative;
}
.reincarnator-head {
  display: flex; align-items: center; gap: 10px;
  padding-bottom: 12px; margin-bottom: 10px;
  border-bottom: 1px solid var(--line); position: relative;
  flex-wrap: wrap;
}
.reincarnator-head::after {
  content: ''; position: absolute; bottom: -1px; left: 0;
  width: 40px; height: 1px; background: var(--gold);
}
.rank-badge {
  padding: 4px 12px; border-radius: 2px; font-size: 11px; font-weight: 700;
  color: #fff; letter-spacing: 2px;
  font-family: 'Georgia','Noto Serif SC',serif;
  text-shadow: 0 1px 2px rgba(0,0,0,0.2); position: relative;
}
.rank-badge::before, .rank-badge::after {
  content: ''; position: absolute; top: 50%; width: 3px; height: 3px;
  border-radius: 50%; background: currentColor; opacity: 0.5; transform: translateY(-50%);
}
.rank-badge::before { left: 4px; }
.rank-badge::after  { right: 4px; }
.rank-凡人 { background: var(--rank-凡人); }
.rank-精锐 { background: var(--rank-精锐); }
.rank-勇者 { background: var(--rank-勇者); }
.rank-英雄 { background: var(--rank-英雄); }
.rank-半神 { background: var(--rank-半神); box-shadow: 0 0 8px rgba(201,148,90,0.5); }
.rank-神祇 { background: var(--rank-神祇); box-shadow: 0 0 12px rgba(184,93,93,0.6); }

.rank-mini {
  display: inline-block; padding: 1px 7px; border-radius: 2px;
  font-size: 9.5px; font-weight: 700; color: #fff; letter-spacing: 1px;
  font-family: 'Georgia','Noto Serif SC',serif; vertical-align: middle;
  margin-left: 4px; text-shadow: 0 1px 1px rgba(0,0,0,0.25);
}

.lv-artistic {
  font-family: 'Georgia','Noto Serif SC',serif;
  font-size: 28px; font-weight: 700; line-height: 1;
  color: transparent;
  -webkit-text-stroke: 1px var(--gold-dark);
  text-shadow: 0 0 4px rgba(184,147,90,0.35);
  letter-spacing: 1px;
  display: inline-flex; align-items: flex-start;
}
.lv-artistic .prefix {
  font-size: 10px; -webkit-text-stroke: 0;
  color: var(--muted); vertical-align: super;
  margin-right: 2px; font-weight: 400;
  margin-top: 2px;
}

.armor-small {
  font-size: 10px; color: var(--muted);
  padding: 2px 8px; border-radius: 2px;
  background: rgba(216,207,190,0.4);
  border: 1px solid var(--line);
  font-family: 'Georgia','Noto Serif SC',serif;
  letter-spacing: 1px;
}
.armor-small .num {
  color: var(--gold-deep); font-weight: 700;
  font-family: 'Georgia',monospace; margin-left: 3px;
}

.points-block { margin-left: auto; display: flex; align-items: baseline; gap: 6px; }
.points-block .label {
  color: var(--muted); font-size: 10.5px; letter-spacing: 1px;
  font-family: 'Georgia',serif; text-transform: uppercase;
}
.points-block .value {
  font-weight: 700; color: var(--gold-deep);
  font-family: 'Georgia','Consolas',monospace; font-size: 17px; letter-spacing: 0.5px;
}

.reincarnator-row {
  display: flex; gap: 12px; padding: 6px 0; font-size: 12.5px;
  align-items: flex-start;
}
.reincarnator-row + .reincarnator-row { border-top: 1px solid rgba(216,207,190,0.4); }
.reincarnator-row .label {
  color: var(--muted); flex-shrink: 0; width: 62px; font-size: 11px;
  letter-spacing: 1.5px; padding-top: 2px;
  font-family: 'Georgia',serif; text-transform: uppercase;
}
.reincarnator-row .value { flex: 1; word-break: break-word; }
.reincarnator-row .value .currency {
  display: inline-flex; align-items: baseline; gap: 4px;
  padding: 2px 8px; border-radius: 2px;
  background: rgba(224,192,136,0.15);
  border: 1px solid var(--gold-light);
  font-family: 'Georgia','Noto Serif SC',serif;
  color: var(--gold-deep);
}
.reincarnator-row .value .currency .num { font-weight: 700; font-size: 13px; }

.sex-sym {
  display: inline-block;
  margin-left: 4px;
  font-family: 'Georgia','Noto Serif SC',serif;
  font-weight: 700;
  font-size: 13px;
  vertical-align: middle;
  line-height: 1;
}
.sex-sym.male   { color: var(--sex-male); }
.sex-sym.female { color: var(--sex-female); }
.sex-sym.other  { color: var(--sex-other); }

#entries { display: flex; gap: 6px; }
.entry-btn {
  flex: 1; display: flex; align-items: center; justify-content: center;
  gap: 4px; padding: 15px 2px; text-align: center;
  font-weight: 700; font-size: 12px; letter-spacing: 1px;
  border-radius: 3px; cursor: pointer; user-select: none;
  color: var(--gold-deep);
  background-color: var(--marble-1);
  background-image:
    repeating-linear-gradient(115deg,
      transparent 0, transparent 15px,
      rgba(160,150,130,0.04) 15px, rgba(160,150,130,0.04) 16px,
      transparent 16px, transparent 40px),
    linear-gradient(135deg, #faf7f1 0%, #ede6d6 100%);
  border: 1px solid var(--gold);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), inset 0 -1px 0 rgba(120,100,60,0.08), 0 2px 5px rgba(80,65,40,0.1);
  transition: all 0.2s ease;
  font-family: 'Georgia','Noto Serif SC',serif;
}
.entry-btn .ico { font-size: 13px; opacity: 0.85; }
.entry-btn:hover {
  border-color: var(--gold-dark); color: var(--gold-dark);
  box-shadow: inset 0 1px 0 rgba(255,255,255,1), 0 4px 12px rgba(184,147,90,0.28);
  transform: translateY(-1px);
}

.mask {
  position: fixed; inset: 0;
  background: rgba(28,22,15,0.55);
  backdrop-filter: blur(4px);
  display: flex; align-items: flex-start; justify-content: center;
  z-index: 1000; opacity: 0; pointer-events: none;
  transition: opacity 0.22s ease;
  padding: 40px 16px;
  overflow-y: auto;
}
.mask.show { opacity: 1; pointer-events: auto; }
.modal {
  border-radius: 8px; border: 1px solid var(--gold-dark);
  box-shadow: 0 0 0 1px var(--gold-light), var(--shadow-lg);
  width: 100%; max-width: 560px;
  display: flex; flex-direction: column; overflow: hidden; position: relative;
  margin: auto 0;
}
.modal::before, .modal::after {
  content: ''; position: absolute; width: 16px; height: 16px;
  border: 1px solid var(--gold); pointer-events: none; z-index: 5; opacity: 0.6;
}
.modal::before { top: 6px; left: 6px; border-right: none; border-bottom: none; }
.modal::after  { bottom: 6px; right: 6px; border-left: none; border-top: none; }
.modal-head {
  padding: 14px 20px; font-size: 14px; font-weight: 700;
  border-bottom: 1px solid var(--gold-light);
  display: flex; justify-content: space-between; align-items: center;
  flex-shrink: 0; color: var(--gold-deep); letter-spacing: 3px;
  font-family: 'Georgia','Noto Serif SC',serif; position: relative;
}
.modal-head::after {
  content: ''; position: absolute; bottom: -1px; left: 20px;
  width: 50px; height: 1px; background: var(--gold);
}
.close-btn {
  cursor: pointer; font-size: 15px; color: var(--muted);
  background: transparent; border: 1px solid transparent;
  width: 26px; height: 26px; border-radius: 2px;
  transition: all 0.15s; display: flex; align-items: center; justify-content: center;
  font-family: 'Georgia',serif;
}
.close-btn:hover {
  border-color: var(--gold); color: var(--gold-deep);
  background: rgba(224,192,136,0.12);
}
.modal-body { padding: 16px 20px; }

.mask::-webkit-scrollbar { width: 8px; }
.mask::-webkit-scrollbar-thumb {
  background: linear-gradient(180deg, var(--gold-light), var(--gold));
  border-radius: 4px;
}
.mask::-webkit-scrollbar-track { background: rgba(40,30,15,0.2); }

.tabs { display: flex; gap: 0; margin-bottom: 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.tab {
  padding: 8px 14px; font-size: 12px; cursor: pointer; color: var(--muted);
  letter-spacing: 1.2px; transition: all 0.15s; position: relative;
  font-family: 'Georgia','Noto Serif SC',serif; background: transparent;
}
.tab.active { color: var(--gold-deep); font-weight: 700; }
.tab.active::after {
  content: ''; position: absolute; bottom: -1px; left: 0; right: 0;
  height: 2px; background: linear-gradient(90deg, transparent, var(--gold), transparent);
}
.tab:hover:not(.active) { color: var(--gold-dark); }

.card-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 10px;
}
.char-card {
  display: flex; align-items: center; gap: 10px; padding: 10px;
  border-radius: 4px; cursor: pointer; transition: all 0.2s;
  border: 1px solid var(--line); background: rgba(255,255,255,0.6);
  box-shadow: var(--shadow-sm); position: relative;
}
.char-card:hover {
  transform: translateY(-2px); border-color: var(--gold-light);
  box-shadow: 0 6px 16px rgba(184,147,90,0.2);
  background: rgba(255,255,255,0.9);
}
.char-card.unrecruited { opacity: 0.72; filter: grayscale(0.35); }
.char-avatar {
  width: 42px; height: 42px; border-radius: 3px;
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-weight: 700; font-size: 17px; flex-shrink: 0;
  background: linear-gradient(135deg, #b3a68d, #8a7a60);
  border: 2px solid #dcc7cb;
  font-family: 'Georgia','Noto Serif SC',serif;
  text-shadow: 0 1px 2px rgba(0,0,0,0.25);
  cursor: pointer; position: relative; overflow: hidden;
}
.char-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
.char-name {
  font-weight: 600; font-size: 13px;
  display: flex; align-items: center; flex-wrap: wrap; gap: 2px;
}
.char-sub { font-size: 10.5px; color: var(--muted); margin-top: 2px; line-height: 1.4; }

.b-凡人 { border-color: var(--rank-凡人); }
.b-精锐 { border-color: var(--rank-精锐); }
.b-勇者 { border-color: var(--rank-勇者); }
.b-英雄 { border-color: var(--rank-英雄); }
.b-半神 { border-color: var(--rank-半神); box-shadow: 0 0 10px rgba(201,148,90,0.35); }
.b-神祇 { border-color: var(--rank-神祇); box-shadow: 0 0 12px rgba(184,93,93,0.4); }

.char-detail { display: flex; gap: 18px; }
.detail-left {
  width: 130px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center;
}
.detail-avatar {
  width: 100px; height: 100px; border-radius: 4px;
  display: flex; align-items: center; justify-content: center;
  font-size: 34px; color: #fff; font-weight: 700;
  background: linear-gradient(135deg, #b3a68d, #8a7a60);
  border: 3px solid #dcc7cb;
  box-shadow: var(--shadow-sm);
  font-family: 'Georgia','Noto Serif SC',serif;
  text-shadow: 0 2px 4px rgba(0,0,0,0.3);
  cursor: pointer; position: relative; overflow: hidden;
}
.detail-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
.detail-avatar::after {
  content: '点击更换';
  position: absolute; inset: auto 0 0 0;
  background: rgba(0,0,0,0.55); color: #fff;
  font-size: 10px; line-height: 18px; text-align: center;
  font-family: 'Noto Sans SC',sans-serif;
  opacity: 0; transition: opacity 0.15s;
  pointer-events: none;
}
.detail-avatar:hover::after { opacity: 1; }
.detail-name {
  font-size: 16px; font-weight: 700; margin-top: 10px;
  text-align: center;
  font-family: 'Georgia','Noto Serif SC',serif;
  color: var(--gold-deep); letter-spacing: 1px;
}
.detail-rank {
  margin-top: 6px; padding: 3px 12px; border-radius: 2px;
  font-size: 10.5px; font-weight: 700; color: #fff; letter-spacing: 1.5px;
  font-family: 'Georgia','Noto Serif SC',serif;
  text-shadow: 0 1px 2px rgba(0,0,0,0.25);
}
.detail-meta {
  font-size: 10.5px; color: var(--muted); text-align: center;
  margin-top: 8px; line-height: 1.7;
}
.detail-meta .sex-line {
  color: var(--gold-dark); font-weight: 600; font-size: 11px;
}
.detail-right { flex: 1; min-width: 0; display: flex; flex-direction: column; }

.bar-row {
  display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 11px;
}
.bar-row .label {
  width: 44px; color: var(--muted); flex-shrink: 0;
  letter-spacing: 1.5px; font-family: 'Georgia',serif;
}
.bar-track {
  flex: 1; height: 6px; background: rgba(216,207,190,0.5);
  overflow: hidden; border: 1px solid var(--line); position: relative;
}
.bar-fill { height: 100%; transition: width 0.4s ease; }
.fill-fav { background: linear-gradient(90deg, #e8b8c5, #b85d7d); }
.fill-cor { background: linear-gradient(90deg, #c9b8c9, #7c5cc4); }
.bar-num {
  width: 42px; text-align: right; font-weight: 700; font-size: 11px;
  color: var(--gold-deep); font-family: 'Georgia',monospace;
}
.bar-num.neg { color: var(--sex-other); }

/* ===== 对称条（好感度 / 声望） ===== */
.bar-track-sym {
  flex: 1; height: 6px;
  background: rgba(216,207,190,0.5);
  border: 1px solid var(--line);
  position: relative;
  overflow: hidden;
}
.bar-track-sym::before {
  content: ''; position: absolute;
  left: 50%; top: -1px; bottom: -1px; width: 1px;
  background: var(--line-2);
  z-index: 2;
  transform: translateX(-0.5px);
}
.bar-fill-neg,
.bar-fill-pos {
  position: absolute; top: 0; bottom: 0;
  transition: width 0.4s ease;
}
.bar-fill-neg { right: 50%; }
.bar-fill-pos { left: 50%; }
.fav-neg { background: linear-gradient(90deg, #6b5058, #8a6da5); }
.fav-pos { background: linear-gradient(90deg, #e8b8c5, #b85d7d); }
.rep-neg { background: linear-gradient(90deg, #6b3030, #b85d5d); }
.rep-pos { background: linear-gradient(90deg, #c9c18a, #b8935a); }

.res-bar-row {
  display: flex; align-items: center; gap: 6px;
  margin-bottom: 6px; font-size: 10.5px;
}
.res-bar-row .lbl {
  width: 32px; color: var(--muted); flex-shrink: 0;
  letter-spacing: 1px; font-family: 'Georgia',serif; font-weight: 700;
}
.res-bar-track {
  flex: 1; height: 7px; background: rgba(216,207,190,0.4);
  border: 1px solid var(--line); overflow: hidden; position: relative;
}
.res-bar-fill { height: 100%; transition: width 0.4s ease; }
.fill-hp  { background: linear-gradient(90deg, #e8a0a0, var(--res-hp)); }
.fill-mp  { background: linear-gradient(90deg, #a0b8d8, var(--res-mp)); }
.fill-sp  { background: linear-gradient(90deg, #a8c89c, var(--res-sp)); }
.fill-san { background: linear-gradient(90deg, #b8a0d0, var(--res-san)); }
.res-bar-num {
  width: 78px; text-align: right; font-weight: 700;
  font-size: 10.5px; color: var(--gold-deep);
  font-family: 'Georgia',monospace;
}

.block { margin-bottom: 14px; }
.block-title {
  font-size: 11px; color: var(--gold-dark); font-weight: 700;
  margin-bottom: 6px; letter-spacing: 2px;
  font-family: 'Georgia','Noto Serif SC',serif;
  text-transform: uppercase; padding-bottom: 4px;
  border-bottom: 1px solid var(--gold-light);
  position: relative; display: inline-block;
}
.kv-row {
  display: flex; gap: 10px; padding: 3px 0; font-size: 11.5px; line-height: 1.6;
}
.kv-row .k { color: var(--muted); flex-shrink: 0; min-width: 52px; font-weight: 500; }
.kv-row .v { flex: 1; word-break: break-word; color: var(--ink-2); }

.quote-block {
  padding: 10px 14px 10px 22px;
  background: rgba(224,192,136,0.08);
  border-left: 2px solid var(--gold);
  font-style: italic; color: var(--ink-2);
  font-size: 11.5px; line-height: 1.7;

.timeline { position: relative; padding-left: 24px; }

}
.timeline-item {
  position: relative; padding: 6px 0 14px; font-size: 12px;
  font-family: 'Georgia','Noto Serif SC',serif;
}
.timeline-item::before {
  content: ''; position: absolute; left: -20px; top: 10px;
  width: 9px; height: 9px; border-radius: 50%;

.title-card {
  padding: 10px 14px; margin-bottom: 8px;
  background: linear-gradient(135deg, rgba(250,247,241,0.9), rgba(240,232,215,0.85));

  border-top: 1px solid var(--gold-light);
  border-right: 1px solid var(--gold-light);
  border-bottom: 1px solid var(--gold-light);

}
.title-card .title-name {

.empty-tip {

}

.section-group { margin-bottom: 16px; }

  font-family: 'Georgia','Noto Serif SC',serif;

}

.tag-list { display: flex; flex-wrap: wrap; gap: 6px; }
.skill-tag {
  font-size: 11px; padding: 3px 11px; border-radius: 2px;

  color: var(--gold-deep); font-weight: 600;
  border: 1px solid var(--gold-light);
  font-family: 'Georgia','Noto Serif SC',serif; letter-spacing: 0.5px;
  display: inline-flex; align-items: baseline; gap: 5px;
}

}
.skill-tag-clickable {
  cursor: pointer; position: relative; transition: all 0.15s ease;
}
.skill-tag-clickable:hover {
  background: linear-gradient(135deg, #f5ecd8, #e8d9b8);
  border-color: var(--gold);
  box-shadow: 0 2px 6px rgba(184,147,90,0.25);
  transform: translateY(-1px);
}

.info-popover {
  position: fixed; z-index: 2000; max-width: 320px; min-width: 200px;
  background: rgba(255, 250, 248, 0.98);
  border: 1px solid var(--gold-dark); border-radius: 6px;
  box-shadow: 0 0 0 1px var(--gold-light), 0 8px 24px rgba(40,30,15,0.3);
  padding: 12px 14px; font-size: 12px; line-height: 1.6;
  color: var(--ink); animation: popFadeIn 0.15s ease;
  backdrop-filter: blur(8px);
}
@keyframes popFadeIn {
  from { opacity: 0; transform: translateY(-4px); }
  to   { opacity: 1; transform: translateY(0); }
}
.info-popover::before {
  content: ''; position: absolute; top: -6px; left: 20px;
  width: 10px; height: 10px; background: rgba(255, 250, 248, 0.98);
  border-left: 1px solid var(--gold-dark); border-top: 1px solid var(--gold-dark);
  transform: rotate(45deg);
}
.info-popover-head {
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  padding-bottom: 6px; margin-bottom: 8px;
  border-bottom: 1px solid var(--gold-light);
}
.info-popover-title {
  font-family: 'Georgia','Noto Serif SC',serif; font-weight: 700;
  font-size: 13px; color: var(--gold-deep); letter-spacing: 0.5px;
  flex: 1; min-width: 60px; word-break: break-word;
}
.info-popover-badge {
  font-size: 10px; padding: 1px 7px; border-radius: 2px;
  font-weight: 700; letter-spacing: 0.5px; color: #fff;
  font-family: 'Georgia','Noto Serif SC',serif;
  text-shadow: 0 1px 1px rgba(0,0,0,0.15); white-space: nowrap;
}
.info-popover-type {
  font-size: 10px; padding: 1px 7px; border-radius: 2px;
  background: rgba(224,192,136,0.2); color: var(--gold-dark);
  border: 1px solid var(--gold-light);
  font-family: 'Georgia','Noto Serif SC',serif;
  letter-spacing: 0.5px; white-space: nowrap;
}
.info-popover-type.passive {
  background: rgba(122,158,110,0.15); color: var(--q-精良);
  border-color: rgba(107,155,92,0.4);
}
.info-popover-row {
  font-size: 11.5px; line-height: 1.7; color: var(--ink-2);
  margin-bottom: 6px; word-break: break-word;
}
.info-popover-row .k {
  color: var(--muted); font-family: 'Georgia',serif;
  letter-spacing: 1px; font-size: 10.5px; margin-right: 6px;
}
.info-popover-effects {
  margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line);
}
.info-popover-effects-title {
  font-size: 10.5px; color: var(--gold-dark); letter-spacing: 1.5px;
  font-family: 'Georgia','Noto Serif SC',serif; margin-bottom: 5px; font-weight: 700;
}
.info-popover-effect-item {
  font-size: 11px; line-height: 1.7; margin-bottom: 4px;
  padding-left: 10px; position: relative; word-break: break-word;
}
.info-popover-effect-item::before {
  content: '·'; position: absolute; left: 0;
  color: var(--gold); font-weight: 700;
}
.info-popover-effect-item .eff-name {
  color: var(--gold-dark); font-weight: 700; margin-right: 5px;
}
.info-popover-effect-item .eff-desc { color: var(--ink-2); }

.part-row {

.part-row .part-name {

  font-family: 'Georgia','Noto Serif SC',serif; letter-spacing: 1px;
}
.part-row .part-body { flex: 1; }
.part-row .part-appear {
  color: var(--muted); font-size: 11px; line-height: 1.5;
}
.part-row .part-status {
  color: var(--ink); font-size: 11.5px; line-height: 1.5; margin-top: 2px;
}

.dev-row {
  padding: 8px 12px; margin-bottom: 6px; border-radius: 3px;
  background: rgba(255,255,255,0.55);
  border-left: 3px solid var(--gold);
  border-top: 1px solid var(--line);
  border-right: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}
.dev-head {
  display: flex; align-items: center; gap: 8px; margin-bottom: 4px;
}
.dev-name {
  font-weight: 700; font-size: 12px;
  font-family: 'Georgia','Noto Serif SC',serif; color: var(--ink);
}
.dev-lv {
  font-size: 10px; padding: 1px 8px; border-radius: 2px;
  background: var(--gold-deep); color: #fff;
  font-family: 'Georgia',monospace; font-weight: 700; letter-spacing: 1px;
}
.dev-lv.max { background: var(--q-神话); }
.dev-body { font-size: 11px; color: var(--muted); line-height: 1.55; }
.dev-body .react { color: var(--ink-2); }
.dev-body .detail { font-style: italic; margin-top: 2px; }

.fetish-card {
  padding: 10px 12px; margin-bottom: 8px; border-radius: 3px;
  background: rgba(255,255,255,0.6);
  border-left: 3px solid var(--q-史诗);
  border-top: 1px solid var(--line);
  border-right: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}
.fetish-head {
  display: flex; justify-content: space-between; align-items: center;
  gap: 8px; margin-bottom: 6px;
}
.fetish-name {
  font-weight: 700; font-size: 12px;
  font-family: 'Georgia','Noto Serif SC',serif;
}
.fetish-desc { font-size: 11px; color: var(--muted); line-height: 1.6; margin-bottom: 6px; }
.fetish-dev-bar {
  display: flex; align-items: center; gap: 8px; font-size: 10.5px;
}
.fetish-dev-bar .label {
  color: var(--muted); letter-spacing: 1px; font-family: 'Georgia',serif;
}
.fetish-dev-bar .track {
  flex: 1; height: 5px; background: rgba(216,207,190,0.5);
  border: 1px solid var(--line);
}
.fetish-dev-bar .fill {
  height: 100%; background: linear-gradient(90deg, #e8c9a8, #b8895a);
}
.fetish-dev-bar .num {
  font-weight: 700; color: var(--gold-deep);
  font-family: 'Georgia',monospace; min-width: 26px; text-align: right;
}

.period-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px;
}
.period-item {
  display: flex; justify-content: space-between;
  font-size: 11px; padding: 2px 0;
  border-bottom: 1px dashed rgba(216,207,190,0.4);
}
.period-item .k { color: var(--muted); }
.period-item .v {
  color: var(--ink); font-weight: 600; font-family: 'Georgia',monospace;
}
.period-phase {
  display: inline-block; padding: 3px 10px; border-radius: 2px;
  font-size: 11px; font-weight: 700; color: #fff; letter-spacing: 1px;
  font-family: 'Georgia','Noto Serif SC',serif; margin-bottom: 8px;
}
.phase-经期   { background: #b85d5d; }
.phase-卵泡期 { background: #7a9e6e; }
.phase-排卵期 { background: #c9945a; }
.phase-黄体期 { background: #8a6da5; }

.level-layout {
  display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap;
}
.radar-wrap {
  flex: 0 0 200px; width: 200px;
}
.radar-svg { width: 100%; display: block; }
.attr-list {
  flex: 1; min-width: 180px;
}
.attr-row {
  display: flex; align-items: center; gap: 8px;
  padding: 5px 0; font-size: 11.5px;
  border-bottom: 1px dashed rgba(216,207,190,0.45);
}
.attr-row:last-child { border-bottom: none; }
.attr-row .name {
  flex-shrink: 0; width: 48px; color: var(--muted);
  font-family: 'Georgia','Noto Serif SC',serif; letter-spacing: 1px;
}
.attr-row .num {
  flex-shrink: 0; width: 56px; text-align: right;
  font-family: 'Georgia',monospace; font-weight: 700;
  color: var(--gold-deep); font-size: 12px;
}
.attr-row .max {
  flex-shrink: 0; width: 40px; text-align: right;
  font-family: 'Georgia',monospace; font-size: 10px; color: var(--muted);
}
.attr-row .attr-track {
  flex: 1; height: 5px; background: rgba(216,207,190,0.5);
  border: 1px solid var(--line); overflow: hidden;
}
.attr-row .attr-fill {
  height: 100%; background: linear-gradient(90deg, var(--gold-light), var(--gold));
}

/* ===== 加点按钮 ===== */
.attr-btn-group {
  display: inline-flex;
  gap: 4px;
  margin-left: 6px;
  flex-shrink: 0;
}
.attr-btn {
  width: 24px;
  height: 24px;
  border-radius: 3px;
  border: 1px solid var(--gold-light);
  background: linear-gradient(135deg, #faf7f1, #ede6d6);
  color: var(--gold-deep);
  font-size: 14px;
  font-weight: 700;
  line-height: 1;
  cursor: pointer;
  transition: all 0.15s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  font-family: 'Georgia', serif;
}
.attr-btn:hover:not(:disabled) {
  border-color: var(--gold);
  background: linear-gradient(135deg, #f5ecd8, #e8d9b8);
  transform: translateY(-1px);
  box-shadow: 0 2px 6px rgba(184,147,90,0.25);
}
.attr-btn:disabled {
  opacity: 0.35;
  cursor: not-allowed;
  background: rgba(255,255,255,0.5);
}
.attr-btn.attr-plus:hover:not(:disabled) {
  color: var(--q-精良);
  border-color: var(--q-精良);
}
.attr-btn.attr-minus:hover:not(:disabled) {
  color: var(--res-hp);
  border-color: var(--res-hp);
}
.attr-row .delta {
  display: inline-block;
  margin-left: 3px;
  color: var(--q-精良);
  font-size: 9.5px;
  font-weight: 700;
  font-family: 'Georgia', monospace;
}

/* ===== 加点确认条 ===== */
.attr-confirm-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-top: 12px;
  padding: 10px 12px;
  background: rgba(224,192,136,0.1);
  border: 1px dashed var(--gold-light);
  border-radius: 3px;
  flex-wrap: wrap;
}
.attr-confirm-info {
  display: flex;
  gap: 14px;
  font-size: 11.5px;
  color: var(--muted);
  font-family: 'Georgia', 'Noto Serif SC', serif;
  letter-spacing: 0.5px;
  align-items: baseline;
  flex-wrap: wrap;
}
.attr-confirm-info strong {
  color: var(--gold-deep);
  font-weight: 700;
  font-family: 'Georgia', monospace;
  font-size: 12.5px;
  margin-left: 2px;
}
.attr-confirm-info .used strong { color: var(--q-精良); }
.attr-confirm-info .remain strong { color: var(--q-传说); }
.attr-confirm-btns {
  display: flex;
  gap: 8px;
  flex-shrink: 0;
}
.attr-confirm-reset,
.attr-confirm-ok {
  padding: 6px 14px;
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: 1px;
  border-radius: 3px;
  cursor: pointer;
  transition: all 0.15s ease;
  font-family: 'Georgia', 'Noto Serif SC', serif;
}
.attr-confirm-reset {
  background: transparent;
  border: 1px solid var(--line-2);

<script>
/* ============================================================
   计算层 + 数据读写层
   ============================================================ */
(function() {
  'use strict';

  async function tryGetVariables() {
    const TH = window.TavernHelper;
    if (!TH || typeof TH.getVariables !== 'function') return null;
    const argsList = [
      { type: 'message', message_id: 'latest' },
      { type: 'message' },
      { type: 'chat', message_id: 'latest' },
      { type: 'chat' },
    ];
    for (const args of argsList) {
      try {
        let v = TH.getVariables(args);
        if (v && typeof v.then === 'function') v = await v;
        if (v && v.stat_data) return v.stat_data;
        if (v && (v.轮回者 || v.世界 || v.角色)) return v;
      } catch(e) { /* 继续 */ }
    }
    return null;
  }

  async function tryMvuGet() {
    const M = window.Mvu;
    if (!M || typeof M.getMvuData !== 'function') return null;
    try {
      let d = M.getMvuData({ type: 'message', message_id: 'latest' });
      if (d && typeof d.then === 'function') d = await d;
      if (d && d.stat_data) return d.stat_data;
    } catch(e) { /* 继续 */ }
    return null;
  }

  async function readStat() {
    let s = await tryGetVariables();
    if (s) return s;
    return await tryMvuGet();
  }

  async function writeStat(stat) {
    const M = window.Mvu;
    const TH = window.TavernHelper;

    if (M && typeof M.replaceMvuData === 'function') {
      try {
        await M.replaceMvuData({ stat_data: stat }, { type: 'message', message_id: 'latest' });
        return true;
      } catch(e) { console.warn('[tower] Mvu.replaceMvuData failed', e); }
    }
    if (TH && typeof TH.replaceVariables === 'function') {
      try {
        await TH.replaceVariables({ stat_data: stat }, { type: 'message', message_id: 'latest' });
        return true;
      } catch(e) { console.warn('[tower] TH.replaceVariables failed', e); }
    }
    if (TH && typeof TH.insertOrAssignVariables === 'function') {
      try {
        await TH.insertOrAssignVariables({ stat_data: stat }, { type: 'message', message_id: 'latest' });
        return true;
      } catch(e) { console.warn('[tower] TH.insertOrAssignVariables failed', e); }
    }
    return false;
  }

  window.__tower_read = readStat;
  window.__tower_write = writeStat;
  window.__tower_cached_stat = null;
  window.__tower_attrPreview = null;

  function toNum(v, def) {
    const n = Number(v);
    return Number.isFinite(n) ? n : (def ?? 0);
  }
  function rankByLv(lv) {
    if (lv <= 15) return '凡人';
    if (lv <= 30) return '精锐';
    if (lv <= 50) return '勇者';
    if (lv <= 75) return '英雄';
    if (lv <= 100) return '半神';
    return '神祇';
  }
  function hpMaxByCon(con) {
    if (con <= 30) return 150 * con;
    if (con <= 60) return 4500 + 100 * (con - 30);
    return 7500 + 60 * (con - 60);
  }
  function computeDerived(五维, 装备) {
    const str = Math.max(1, Math.floor(toNum(五维?.力量, 1)));
    const agi = Math.max(1, Math.floor(toNum(五维?.敏捷, 1)));
    const con = Math.max(1, Math.floor(toNum(五维?.体质, 1)));
    const int_ = Math.max(1, Math.floor(toNum(五维?.智力, 1)));
    const spi = Math.max(1, Math.floor(toNum(五维?.精神, 1)));
    const lv = str + agi + con + int_ + spi;
    const 位阶 = rankByLv(lv);
    const hp上限 = hpMaxByCon(con);
    const mp上限 = (int_ + spi) * 30;
    const sp上限 = (con + agi) * 15;
    let 护甲总值 = 0;
    for (const item of Object.values(装备 || {})) {
      if (item && item.类型 === '防具' && item.护甲值 != null) {
        护甲总值 += toNum(item.护甲值, 0);
      }
    }
    return {
      lv, 位阶, hp上限, mp上限, sp上限, 护甲总值,
      修正: {
        力量: Math.floor(str / 3),
        敏捷: Math.floor(agi / 3),
        体质: Math.floor(con / 3),
        智力: Math.floor(int_ / 3),
        精神: Math.floor(spi / 3),
      },
    };
  }
  function derivedChanged(a, b) {
    if (!a || !b) return true;
    return JSON.stringify(a) !== JSON.stringify(b);
  }

  async function recalcAll() {
    const stat = await readStat();
    if (!stat) {
      console.warn('[tower] 读不到 stat_data，跳过重算');
      return;
    }

    let dirty = false;
    const newStat = _.cloneDeep(stat);

    if (newStat.轮回者 && newStat.轮回者.五维) {
      const d = computeDerived(newStat.轮回者.五维, newStat.轮回者.当前装备);
      if (derivedChanged(d, newStat.轮回者._派生)) {
        _.set(newStat, '轮回者._派生', d);
        dirty = true;
      }
    }
    for (const [name, c] of Object.entries(newStat.角色 || {})) {
      if (!c || !c.普通 || !c.普通.五维) continue;
      const d = computeDerived(c.普通.五维, c.普通.装备);
      if (derivedChanged(d, c._派生)) {
        _.set(newStat, `角色.${name}._派生`, d);
        dirty = true;
      }
    }

    if (!dirty) {
      window.__tower_cached_stat = newStat;
      return;
    }

    const ok = await writeStat(newStat);
    window.__tower_cached_stat = newStat;
    if (ok) console.log('[tower] _派生 已重算写回');
    else console.warn('[tower] _派生 重算完成，但写回失败');
  }

  window.__towerRecalc = recalcAll;
})();


/* ============================================================
   展示层
   ============================================================ */
(function() {
  'use strict';

  const RANK_MAX = { '凡人': 8, '精锐': 18, '勇者': 30, '英雄': 45, '半神': 60, '神祇': 90 };

  function getVariables() {
    return window.__tower_cached_stat || {};
  }
  function getVar(path, def) {
    try {
      const v = (typeof _ !== 'undefined' && _.get) ? _.get(getVariables(), path, def) : dig(getVariables(), path, def);
      return v === undefined || v === null ? def : v;
    } catch(e) { return def; }
  }
  function dig(obj, path, def) {
    const parts = String(path).split('.');
    let cur = obj;
    for (const p of parts) {
      if (cur == null || typeof cur !== 'object') return def;
      cur = cur[p];
    }
    return cur === undefined ? def : cur;
  }
  function esc(s) {
    return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function toNum(v, def) {
    const n = Number(v);
    return Number.isFinite(n) ? n : (def ?? 0);
  }
  function sortedEntries(obj) {
    if (!obj || typeof obj !== 'object') return [];
    return Object.entries(obj).sort(([a],[b]) => String(a).localeCompare(String(b), 'zh'));
  }
  function pad2(n) { return String(n).padStart(2, '0'); }
  function fmtTime(t) {
    if (!t || typeof t !== 'object') return '--:--';
    return pad2(toNum(t.时, 0)) + ':' + pad2(toNum(t.分, 0));
  }
  function clampPct(cur, max) {
    if (!max || max <= 0) return 0;
    return Math.max(0, Math.min(100, Math.round(cur / max * 100)));
  }
  function sexSymbol(s) {
    if (s === '男') return '♂';
    if (s === '女') return '♀';
    if (s === '其他') return '⚥';
    return '';
  }
  function sexClass(s) {
    if (s === '男') return 'male';
    if (s === '女') return 'female';
    if (s === '其他') return 'other';
    return '';
  }
  function sexHtml(s, extraStyle) {
    const sym = sexSymbol(s);
    if (!sym) return '';
    return `<span class="sex-sym ${sexClass(s)}"${extraStyle?` style="${extraStyle}"`:''}>${sym}</span>`;
  }
  function fmtShare(share) {
    if (!share || typeof share !== 'object') return '';
    const entries = Object.entries(share).filter(([, v]) => Number.isFinite(Number(v)));
    if (!entries.length) return '';
    return entries.map(([k, v]) => `${k} ${v}%`).join(' · ');
  }

  // 头像
  const AVATAR_PREFIX = 'tower_avatar_';
  function getAvatar(name) {
    try { return localStorage.getItem(AVATAR_PREFIX + name) || ''; } catch(e) { return ''; }
  }
  function setAvatar(name, dataUrl) {
    try {
      if (dataUrl) localStorage.setItem(AVATAR_PREFIX + name, dataUrl);
      else localStorage.removeItem(AVATAR_PREFIX + name);
    } catch(e) { alert('头像保存失败'); }
  }
  function pickAvatar(name, onDone) {
    const input = document.createElement('input');
    input.type = 'file'; input.accept = 'image/*';
    input.onchange = () => {
      const file = input.files && input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          const SIZE = 200;
          const canvas = document.createElement('canvas');
          canvas.width = SIZE; canvas.height = SIZE;
          const ctx = canvas.getContext('2d');
          const scale = Math.max(SIZE / img.width, SIZE / img.height);
          const w = img.width * scale, h = img.height * scale;
          ctx.drawImage(img, (SIZE - w) / 2, (SIZE - h) / 2, w, h);
          const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
          setAvatar(name, dataUrl);
          onDone(dataUrl);
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    };
    input.click();
  }

  // Popover
  let _popoverAnchor = null;
  function hideInfoPopover() {
    const pop = document.getElementById('info-popover');
    if (pop) pop.remove();
    _popoverAnchor = null;
  }
  function showInfoPopover(anchor, html) {
    hideInfoPopover();
    const pop = document.createElement('div');
    pop.id = 'info-popover';
    pop.className = 'info-popover';
    pop.innerHTML = html;
    document.body.appendChild(pop);
    const rect = anchor.getBoundingClientRect();
    const popW = pop.offsetWidth, popH = pop.offsetHeight;
    let left = rect.left;
    if (left + popW > window.innerWidth - 12) left = window.innerWidth - popW - 12;
    if (left < 12) left = 12;
    let top = rect.bottom + 8;
    if (top + popH > window.innerHeight - 12) {
      top = rect.top - popH - 8;
      if (top < 12) top = 12;
    }
    pop.style.left = left + 'px';
    pop.style.top = top + 'px';
    _popoverAnchor = anchor;
  }
  function toggleInfoPopover(anchor, html) {
    if (_popoverAnchor === anchor) { hideInfoPopover(); return; }
    showInfoPopover(anchor, html);
  }
  document.addEventListener('click', e => {
    if (e.target.closest('.item-card') || e.target.closest('.skill-card') ||
        e.target.closest('.skill-tag-clickable') || e.target.closest('.equip-clickable') ||
        e.target.closest('#info-popover')) return;
    hideInfoPopover();
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') hideInfoPopover(); });
  window.addEventListener('resize', hideInfoPopover);
  document.addEventListener('scroll', hideInfoPopover, true);

  function buildEffectsHtml(effects) {
    const entries = Object.entries(effects || {});
    if (!entries.length) return '';
    let html = '<div class="info-popover-effects"><div class="info-popover-effects-title">效果</div>';
    entries.forEach(([name, desc]) => {
      html += `<div class="info-popover-effect-item"><span class="eff-name">${esc(name)}</span><span class="eff-desc">${esc(desc)}</span></div>`;
    });
    html += '</div>';
    return html;
  }

  function buildEquipPopoverHtml(item) {
    if (!item) return '<div class="info-popover-head"><span class="info-popover-title">空</span></div>';
    const name = item.名称 || '—';
    const quality = item.品质 || '普通';
    const type = item.类型 || '';
    const armor = item.护甲值;
    const atk = item.攻击力;
    const dist = item.有效距离;
    const hold = item.持用;
    const status = item.状态 || '';
    const part = item.部位 || '';
    const cover = item.覆盖部位 || '';
    const dmgShare = fmtShare(item.伤害占比);
    const intro = item.介绍 || '';
    const effects = item.效果 || {};

    let head = `<div class="info-popover-head">
      <span class="info-popover-title">${esc(name)}</span>
      <span class="info-popover-badge" style="background:var(--q-${esc(quality)});">${esc(quality)}</span>
      ${type ? `<span class="info-popover-type">${esc(type)}</span>` : ''}
    </div>`;
    let body = '';
    if (status) body += `<div class="info-popover-row"><span class="k">状态</span>${esc(status)}</div>`;
    if (part) body += `<div class="info-popover-row"><span class="k">部位</span>${esc(part)}</div>`;
    if (cover) body += `<div class="info-popover-row"><span class="k">覆盖</span>${esc(cover)}</div>`;
    if (atk != null) body += `<div class="info-popover-row"><span class="k">攻击</span>${esc(atk)}</div>`;
    if (armor != null) body += `<div class="info-popover-row"><span class="k">护甲</span>${esc(armor)}</div>`;
    if (dist) body += `<div class="info-popover-row"><span class="k">距离</span>${esc(dist)}</div>`;
    if (hold) body += `<div class="info-popover-row"><span class="k">持用</span>${esc(hold)}</div>`;
    if (dmgShare) body += `<div class="info-popover-row"><span class="k">伤害占比</span>${esc(dmgShare)}</div>`;
    if (intro) body += `<div class="info-popover-row">${esc(intro)}</div>`;
    body += buildEffectsHtml(effects);
    return head + body;
  }

  function buildSkillPopoverHtml(name, s) {
    const quality = s.品质 || '普通';
    const type = s.类型 || '主动';
    const attr = s.对应属性 || '—';
    const cost = s.消耗 || '无';
    const dist = s.有效距离 || '无';
    const target = s.作用目标 ?? 0;
    const power = s.技能威力 ?? 0;
    const dmgShare = fmtShare(s.伤害占比);
    const intro = s.介绍 || '';
    const effects = s.效果 || {};

    let head = `<div class="info-popover-head">
      <span class="info-popover-title">${esc(name)}</span>
      <span class="info-popover-badge" style="background:var(--q-${esc(quality)});">${esc(quality)}</span>
      <span class="info-popover-type ${type==='被动'?'passive':''}">${esc(type)}</span>
    </div>`;
    let body = '';
    body += `<div class="info-popover-row"><span class="k">属性</span>${esc(attr)}</div>`;
    body += `<div class="info-popover-row"><span class="k">消耗</span>${esc(cost)}</div>`;
    if (type === '主动') {
      body += `<div class="info-popover-row"><span class="k">距离</span>${esc(dist)} · <span class="k">目标</span>${esc(target)} · <span class="k">威力</span>${esc(power)}</div>`;
    }
    if (dmgShare) body += `<div class="info-popover-row"><span class="k">伤害占比</span>${esc(dmgShare)}</div>`;
    if (intro) body += `<div class="info-popover-row">${esc(intro)}</div>`;
    body += buildEffectsHtml(effects);
    return head + body;
  }

  function renderWorldbar() {
    const era    = getVar('世界.纪元', '—');
    const plane  = getVar('世界.当前位面', '高塔');
    const day    = toNum(getVar('世界.已进入位面时间', 0), 0);

    const rest   = toNum(getVar('世界.休息剩余天数', 0), 0);

    const weatherEmoji = (() => {
      const w = String(weather);
      if (/晴/.test(w)) return '☀';
      if (/雨/.test(w)) return '☂';
      if (/雪/.test(w)) return '❄';
      if (/雾/.test(w)) return '☁';
      if (/雷/.test(w)) return '⚡';
      if (/风/.test(w)) return '🌬';
      if (/阴/.test(w)) return '☁';
      return '◈';
    })();

  function renderResBar(label, cur, max, cls) {
    const pct = clampPct(cur, max);
    return `<div class="res-bar-row">
      <span class="lbl">${esc(label)}</span>
      <div class="res-bar-track"><div class="res-bar-fill ${cls}" style="width:${pct}%"></div></div>
      <span class="res-bar-num">${toNum(cur,0)}/${toNum(max,0)}</span>
    </div>`;
  }

  function renderSymBar(label, cur, negCls, posCls, numCls) {
    const val = Number(cur) || 0;
    const abs = Math.abs(val);
    const halfPct = Math.min(50, abs / 2);
    const negW = val < 0 ? halfPct : 0;
    const posW = val > 0 ? halfPct : 0;
    const numClass = val < 0 ? (numCls || 'neg') : (val > 0 ? '' : '');
    const sign = val > 0 ? '+' : '';
    return `<div class="bar-row">
      <span class="label">${esc(label)}</span>
      <div class="bar-track-sym">
        <div class="bar-fill-neg ${negCls}" style="width:${negW}%"></div>
        <div class="bar-fill-pos ${posCls}" style="width:${posW}%"></div>
      </div>
      <span class="bar-num ${numClass}">${sign}${val}</span>
    </div>`;
  }

  function renderRadar(五维, 位阶) {
    const attrs = ['力量','敏捷','体质','智力','精神'];
    const max = RANK_MAX[位阶] || 8;
    const cx = 100, cy = 100, R = 66;
    const angle = i => -Math.PI / 2 + i * 2 * Math.PI / 5;

    let grid = '';
    for (let g = 1; g <= 4; g++) {
      const r = R * g / 4;
      const pts = attrs.map((_, i) => {
        const a = angle(i);
        return `${cx + r * Math.cos(a)},${cy + r * Math.sin(a)}`;
      }).join(' ');
      const stroke = g === 4 ? 'var(--gold-light)' : 'var(--line)';
      const sw = g === 4 ? 1 : 0.5;
      grid += `<polygon points="${pts}" fill="none" stroke="${stroke}" stroke-width="${sw}"/>`;
    }

    let axes = '';
    for (let i = 0; i < 5; i++) {
      const a = angle(i);
      axes += `<line x1="${cx}" y1="${cy}" x2="${cx + R * Math.cos(a)}" y2="${cy + R * Math.sin(a)}" stroke="var(--line)" stroke-width="0.5"/>`;
    }

    const vals = attrs.map(k => Math.max(0, Math.min(max, Number(五维?.[k]) || 0)));
    const dataPts = vals.map((v, i) => {
      const r = R * v / max;
      const a = angle(i);
      return `${cx + r * Math.cos(a)},${cy + r * Math.sin(a)}`;
    }).join(' ');

    let dots = '';
    vals.forEach((v, i) => {
      const r = R * v / max;
      const a = angle(i);
      dots += `<circle cx="${cx + r * Math.cos(a)}" cy="${cy + r * Math.sin(a)}" r="2.2" fill="var(--gold-dark)"/>`;
    });

    let labels = '';
    attrs.forEach((k, i) => {
      const a = angle(i);
      const lx = cx + (R + 22) * Math.cos(a);
      const ly = cy + (R + 22) * Math.sin(a);
      labels += `<text x="${lx}" y="${ly - 3}" text-anchor="middle" font-size="9" fill="var(--muted)" font-family="'Noto Serif SC', serif">${k}</text>`;
      labels += `<text x="${lx}" y="${ly + 9}" text-anchor="middle" font-size="10" fill="var(--gold-deep)" font-family="Georgia, monospace" font-weight="700">${vals[i]}/${max}</text>`;
    });

    return `<svg viewBox="0 0 200 200" class="radar-svg">${grid}${axes}<polygon points="${dataPts}" fill="rgba(184,147,90,0.18)" stroke="var(--gold)" stroke-width="1.5"/>${dots}${labels}</svg>`;
  }

  function renderAttrRows(五维, 位阶) {
    const attrs = ['力量','敏捷','体质','智力','精神'];
    const max = RANK_MAX[位阶] || 8;
    return attrs.map(k => {
      const v = Math.max(0, Math.min(max, Number(五维?.[k]) || 0));
      const pct = Math.round(v / max * 100);
      return `<div class="attr-row">
        <span class="name">${k}</span>
        <span class="num">${v}</span>
        <span class="max">/${max}</span>
        <div class="attr-track"><div class="attr-fill" style="width:${pct}%"></div></div>
      </div>`;
    }).join('');
  }

  function openReincarnatorDetail() {
    window.__tower_attrPreview = null;
    renderReincarnatorTab('level');
    document.getElementById('mask-reincarnator').classList.add('show');
  }

  function renderReincarnatorTab(tab) {
    const body = document.getElementById('reincarnator-detail');
    body.innerHTML = `
      <div class="tabs">
        <div class="tab ${tab==='level'?'active':''}" data-reincarnator-tab="level">等级</div>
        <div class="tab ${tab==='equip'?'active':''}" data-reincarnator-tab="equip">装备</div>
        <div class="tab ${tab==='skill'?'active':''}" data-reincarnator-tab="skill">技能</div>
        <div class="tab ${tab==='item'?'active':''}" data-reincarnator-tab="item">物品</div>
        <div class="tab ${tab==='state'?'active':''}" data-reincarnator-tab="state">状态</div>
      </div>
      <div id="reincarnator-tab-content"></div>
    `;
    body.querySelectorAll('[data-reincarnator-tab]').forEach(el => {
      el.addEventListener('click', () => {
        if (el.dataset.reincarnatorTab !== 'level') {
          window.__tower_attrPreview = null;
        }
        renderReincarnatorTab(el.dataset.reincarnatorTab);
      });
    });

    const content = document.getElementById('reincarnator-tab-content');
    const info = getVar('轮回者', {});
    const derived = info._派生 || {};

    if (tab === 'level') {
      const rank = derived.位阶 || '凡人';
      const lv = toNum(derived.lv, 5);
      const expCur = toNum(info.当前EXP, 0);
      const threshold = lv * 20;
      const expPct = Math.min(100, Math.round(expCur / threshold * 100));
      const fp = toNum(info.自由点, 0);
      const maxAttr = RANK_MAX[rank] || 8;
      const sex = info.性别 || '';

      const keys = ['力量','敏捷','体质','智力','精神'];
      const baseAttrs = {};
      keys.forEach(k => baseAttrs[k] = toNum(info.五维?.[k], 1));

      const preview = window.__tower_attrPreview;
      const displayAttr = preview ? { ...preview } : { ...baseAttrs };
      const used = preview ? keys.reduce((s, k) => s + (displayAttr[k] - baseAttrs[k]), 0) : 0;
      const remaining = fp - used;

      let attrRowsHtml = '';
      keys.forEach(k => {
        const v = displayAttr[k];
        const pct = Math.round(v / maxAttr * 100);
        const delta = v - baseAttrs[k];
        const canPlus = fp > 0 && remaining > 0 && v < maxAttr;
        const canMinus = fp > 0 && delta > 0;
        const btns = fp > 0 ? `
          <span class="attr-btn-group">
            <button type="button" class="attr-btn attr-minus" data-attr-minus="${k}" ${canMinus ? '' : 'disabled'} title="撤回 1 点">−</button>
            <button type="button" class="attr-btn attr-plus" data-attr-plus="${k}" ${canPlus ? '' : 'disabled'} title="加 1 点">+</button>
          </span>
        ` : '';
        attrRowsHtml += `<div class="attr-row">
          <span class="name">${k}</span>
          <span class="num">${v}${delta > 0 ? `<span class="delta">+${delta}</span>` : ''}</span>
          <span class="max">/${maxAttr}</span>
          <div class="attr-track"><div class="attr-fill" style="width:${pct}%"></div></div>
          ${btns}
        </div>`;
      });

      let confirmHtml = '';
      if (fp > 0) {
        const canConfirm = used > 0 && remaining >= 0;
        confirmHtml = `
          <div class="attr-confirm-bar">
            <div class="attr-confirm-info">
              <span>自由点 <strong>${fp}</strong></span>
              ${used > 0 ? `<span class="used">已分配 <strong>${used}</strong></span>` : ''}
              ${used > 0 ? `<span class="remain">剩余 <strong>${remaining}</strong></span>` : ''}
            </div>
            <div class="attr-confirm-btns">
              ${used > 0 ? `<button type="button" class="attr-confirm-reset" data-attr-reset="1">重置</button>` : ''}
              <button type="button" class="attr-confirm-ok" data-attr-confirm="1" ${canConfirm ? '' : 'disabled'}>确认加点</button>
            </div>
          </div>
        `;
      }

      let html = `
        <div class="lv-display">
          <span class="lv-big">${lv}</span>
          <span class="lv-suffix">LEVEL</span>
          ${sexHtml(sex, 'font-size:18px;margin-left:4px;')}
          <span class="rank-chip rank-${esc(rank)}">${esc(rank)}</span>
        </div>
        <div class="exp-block">
          <div class="exp-head">
            <span>升级进度</span>
            <span class="num">${expCur} / ${threshold}</span>
          </div>
          <div class="exp-bar"><div class="exp-fill" style="width:${expPct}%"></div></div>
          ${fp > 0 ? `<div class="free-points">可分配自由点 · <span class="num">${fp}</span></div>` : ''}
        </div>
        <div class="block">
          <div class="block-title">五维</div>
          <div class="level-layout">
            <div class="radar-wrap">${renderRadar(displayAttr, rank)}</div>
            <div class="attr-list">${attrRowsHtml}</div>
          </div>
          ${confirmHtml}
        </div>
      `;
      content.innerHTML = html;

      content.querySelectorAll('[data-attr-plus]').forEach(el => {
        el.addEventListener('click', e => {
          e.stopPropagation();
          const k = el.dataset.attrPlus;
          if (!window.__tower_attrPreview) {
            window.__tower_attrPreview = { ...baseAttrs };
          }
          const p = window.__tower_attrPreview;
          const curUsed = keys.reduce((s, kk) => s + (p[kk] - baseAttrs[kk]), 0);
          if (p[k] >= maxAttr) return;
          if (curUsed >= fp) return;
          p[k]++;
          renderReincarnatorTab('level');
        });
      });

      content.querySelectorAll('[data-attr-minus]').forEach(el => {
        el.addEventListener('click', e => {
          e.stopPropagation();
          const k = el.dataset.attrMinus;
          if (!window.__tower_attrPreview) return;
          const p = window.__tower_attrPreview;
          if (p[k] <= baseAttrs[k]) return;
          p[k]--;
          const anyDelta = keys.some(kk => p[kk] > baseAttrs[kk]);
          if (!anyDelta) window.__tower_attrPreview = null;
          renderReincarnatorTab('level');
        });
      });

      content.querySelectorAll('[data-attr-reset]').forEach(el => {
        el.addEventListener('click', e => {
          e.stopPropagation();
          window.__tower_attrPreview = null;
          renderReincarnatorTab('level');
        });
      });

      content.querySelectorAll('[data-attr-confirm]').forEach(el => {
        el.addEventListener('click', async e => {
          e.stopPropagation();
          if (!window.__tower_attrPreview) return;
          const p = window.__tower_attrPreview;
          const deltaSum = keys.reduce((s, kk) => s + (p[kk] - baseAttrs[kk]), 0);
          if (deltaSum <= 0) return;

          el.disabled = true;
          el.textContent = '写入中…';

          try {
            const stat = await window.__tower_read();
            if (!stat) throw new Error('读取变量失败');

            const latestFp = toNum(stat.轮回者?.自由点, 0);
            const latestAttr = stat.轮回者?.五维 || {};
            for (const k of keys) {
              if (toNum(latestAttr[k], 1) !== baseAttrs[k]) {
                throw new Error('属性已被外部修改，请关闭面板重新打开');
              }
            }
            if (latestFp !== fp) {
              throw new Error('自由点已被外部修改，请关闭面板重新打开');
            }
            if (deltaSum > latestFp) {
              throw new Error('自由点不足');
            }

            _.set(stat, '轮回者.五维', p);
            _.set(stat, '轮回者.自由点', latestFp - deltaSum);
            await window.__tower_write(stat);
            await window.__towerRecalc();
            await window.__towerRefresh();

            window.__tower_attrPreview = null;

            try {
              if (window.toastr && typeof toastr.success === 'function') {
                toastr.success(`已分配 ${deltaSum} 点自由属性`);
              } else {
                console.log(`[tower] 已分配 ${deltaSum} 点自由属性`);
              }
            } catch(_) {}

            renderReincarnatorTab('level');
          } catch (err) {
            console.error('[tower] 确认加点失败', err);
            el.disabled = false;
            el.textContent = '确认加点';
            try {
              if (window.toastr && typeof toastr.error === 'function') {
                toastr.error(err.message || '加点失败');
              } else {
                alert(err.message || '加点失败');
              }
            } catch(_) {
              alert(err.message || '加点失败');
            }
          }
        });
      });

      return;
    }

    if (tab === 'equip') {
      const equip = info.当前装备 || {};
      const entries = sortedEntries(equip);
      if (!entries.length) {
        content.innerHTML = '<div class="empty-tip">未装备任何物品</div>';
        return;
      }
      let html = '';
      entries.forEach(([slot, item]) => {
        const name = (item && item.名称) || '—';
        const quality = (item && item.品质) || '普通';
        const status = (item && item.状态) || '正常';
        html += `<div class="item-card q-${esc(quality)}" data-equip-slot="${esc(slot)}">
          <div class="item-name">
            <span class="item-slot-tag">${esc(slot)}</span>
            ${esc(name)}
            <span class="item-qty" style="background:var(--q-${esc(quality)});color:#fff;">${esc(quality)}</span>
            <span class="item-qty">${esc(status)}</span>
          </div>
        </div>`;
      });
      content.innerHTML = html;
      content.querySelectorAll('[data-equip-slot]').forEach(el => {
        const slot = el.dataset.equipSlot;
        const item = equip[slot] || {};
        el.addEventListener('click', e => {
          e.stopPropagation();
          toggleInfoPopover(el, buildEquipPopoverHtml(item));
        });
      });
      return;
    }

    if (tab === 'skill') {
      const perm = info.永久技能 || {};
      const temp = info.临时技能 || {};
      const renderSkillList = (obj, scope) => sortedEntries(obj).map(([name, s]) => {
        const quality = s.品质 || '普通';
        const type = s.类型 || '主动';
        return `<div class="skill-card" data-skill-scope="${scope}" data-skill-name="${esc(name)}">
          <div class="skill-body">
            <div class="skill-name">
              ${esc(name)}
              <span class="skill-quality-tag" style="background:var(--q-${esc(quality)});">${esc(quality)}</span>
              <span class="skill-type-tag ${type==='被动'?'passive':''}">${esc(type)}</span>
            </div>
            <div class="skill-desc">${esc(s.介绍||'暂无描述')}</div>
            <div class="skill-meta-row">
              <span class="kv">${esc(s.对应属性||'—')}</span>
              <span class="kv">${esc(s.消耗||'无')}</span>
              ${type==='主动'?`<span class="kv">${esc(s.有效距离||'无')} · ${esc(s.作用目标??0)} 目标 · 威力 ${esc(s.技能威力??0)}</span>`:''}
            </div>
          </div>
        </div>`;
      }).join('');
      let html = '';
      const permHtml = renderSkillList(perm, 'perm');
      const tempHtml = renderSkillList(temp, 'temp');
      if (permHtml) html += `<div class="section-title">永久技能</div>${permHtml}`;
      if (tempHtml) html += `<div class="section-title" style="margin-top:16px;">临时技能</div>${tempHtml}`;
      if (!html) html = '<div class="empty-tip">尚未掌握任何技能</div>';
      content.innerHTML = html;
      content.querySelectorAll('[data-skill-scope]').forEach(el => {
        const scope = el.dataset.skillScope;
        const name = el.dataset.skillName;
        const src = scope === 'temp' ? temp : perm;
        el.addEventListener('click', e => {
          e.stopPropagation();
          toggleInfoPopover(el, buildSkillPopoverHtml(name, src[name] || {}));
        });
      });
      return;
    }

    if (tab === 'state') {
      const states = info.状态 || {};
      const entries = sortedEntries(states);
      if (!entries.length) {
        content.innerHTML = '<div class="empty-tip">无状态效果</div>';
        return;
      }
      content.innerHTML = `<div class="block">
        <div class="block-title">状态效果</div>
        ${entries.map(([name, s]) => `
          <div class="kv-row">
            <span class="k" style="color:var(--gold-dark);font-weight:600;">${esc(name)}</span>

    const storylines = getVar('任务.故事线', {});
    const daily = getVar('任务.日常任务', {});
    let html = '';

    if (core && core.名称) {
      const done = core.状态 === '已完成';
      html += `<div class="section-title">核心目标</div>
        <div class="quest-card main ${done?'done':''}">
          <div class="quest-head">
            <div class="quest-name">${esc(core.名称)}</div>
            <span class="quest-badge ${done?'done':''}">${esc(core.状态||'进行中')}</span>
          </div>

          ${core.奖励?`<div class="kv-row"><span class="k">奖励</span><span class="v">${esc(core.奖励)}</span></div>`:''}
        </div>`;
    }

    const slEntries = Object.entries(storylines || {}).filter(([_, tasks]) => tasks && Object.keys(tasks).length);
    if (slEntries.length) {
      html += `<div class="section-title" style="margin-top:16px;">故事线</div>`;
      slEntries.forEach(([slName, tasks]) => {
        const taskEntries = Object.entries(tasks || {}).sort((a, b) => {
          const na = parseFloat(String(a[0]).split('.').pop()) || 0;
          const nb = parseFloat(String(b[0]).split('.').pop()) || 0;
          return na - nb;
        });
        taskEntries.forEach(([taskName, t]) => {
          const done = t.状态 === '已完成';
          html += `<div class="quest-card side ${done?'done':''}">
            <div class="quest-head">
              <div class="quest-name">${esc(taskName)}</div>
              <span class="quest-badge ${done?'done':''}">${esc(t.状态||'进行中')}</span>
            </div>
            ${t.描述?`<div class="kv-row"><span class="k">描述</span><span class="v">${esc(t.描述)}</span></div>`:''}
            ${t.奖励?`<div class="kv-row"><span class="k">奖励</span><span class="v">${esc(t.奖励)}</span></div>`:''}
          </div>`;
        });
      });
    }

    const dailyEntries = sortedEntries(daily || {});
    if (dailyEntries.length) {
      html += `<div class="section-title" style="margin-top:16px;">日常任务</div>`;
      dailyEntries.forEach(([name, t]) => {
        html += `<div class="quest-card odd">
          <div class="quest-head"><div class="quest-name">${esc(name)}</div></div>
          ${t.描述?`<div class="kv-row"><span class="k">描述</span><span class="v">${esc(t.描述)}</span></div>`:''}
          ${t.奖励?`<div class="kv-row"><span class="k">奖励</span><span class="v">${esc(t.奖励)}</span></div>`:''}
        </div>`;
      });
    }

    if (!html) html = '<div class="empty-tip">暂无任务记录</div>';
    body.innerHTML = html;
    document.getElementById('mask-task').classList.add('show');
  }

  function openBuildingModal() {
    const body = document.getElementById('building-body');
    const entries = sortedEntries(getVar('建筑', {}));
    if (!entries.length) {
      body.innerHTML = '<div class="empty-tip">高塔中尚无建筑记载</div>';
      document.getElementById('mask-building').classList.add('show');
      return;
    }
    let html = '';
    entries.forEach(([name, b]) => {
      const triggered = b.本休息期已触发 ? '本休息期已触发' : '';
      html += `<div class="building-card">
        <div class="building-name">${esc(name)}${triggered ? `<span style="font-size:10px;color:var(--muted);font-weight:400;margin-left:6px;">${esc(triggered)}</span>` : ''}</div>
        ${b.叙事倾向?`<div class="building-desc">${esc(b.叙事倾向)}</div>`:''}
      </div>`;
    });
    body.innerHTML = html;
    document.getElementById('mask-building').classList.add('show');
  }

  function openHistoryModal() {
    const body = document.getElementById('history-body');
    const planes = getVar('历史.已完成位面', {});
    const titles = getVar('历史.称号', {});
    let html = '';

    const planeEntries = sortedEntries(planes);
    if (planeEntries.length) {
      html += `<div class="section-title">已完成位面</div>`;
      html += `<div class="timeline">`;
      planeEntries.forEach(([name, info], i) => {
        html += `<div class="timeline-item">
          <div class="tl-name">${String(i+1).padStart(2,'0')} · ${esc(name)}</div>
          ${info.总结 ? `<div class="tl-summary">${esc(info.总结)}</div>` : ''}
        </div>`;
      });
      html += `</div>`;
    }

    const titleEntries = sortedEntries(titles);
    if (titleEntries.length) {
      html += `<div class="section-title" style="margin-top:20px;">称号</div>`;
      titleEntries.forEach(([name, desc]) => {
        html += `<div class="title-card">
          <div class="title-name">${esc(name)}</div>
          <div class="title-desc">${esc(desc)}</div>
        </div>`;
      });
    }

    if (!html) html = '<div class="empty-tip">尚无历史记录</div>';
    body.innerHTML = html;
    document.getElementById('mask-history').classList.add('show');
  }

  const NEWS_CATS = [
    { key: '今日要闻', label: '今日要闻' },
    { key: '现场直击', label: '现场直击' },
    { key: '深度聚焦', label: '深度聚焦' },
    { key: '后续追踪', label: '后续追踪' },
  ];

  function openNewsModal() {
    const body = document.getElementById('news-body');
    let tabsHtml = '<div class="tabs">';
    NEWS_CATS.forEach((c, i) => {
      tabsHtml += `<div class="tab ${i===0?'active':''}" data-news-tab="${esc(c.key)}">${esc(c.label)}</div>`;
    });
    tabsHtml += '</div><div id="news-tab-content"></div>';
    body.innerHTML = tabsHtml;
    body.querySelectorAll('[data-news-tab]').forEach(el => {
      el.addEventListener('click', () => {
        body.querySelectorAll('[data-news-tab]').forEach(t => t.classList.remove('active'));
        el.classList.add('active');
        renderNewsTab(el.dataset.newsTab);
      });
    });
    renderNewsTab('今日要闻');
    document.getElementById('mask-news').classList.add('show');
  }

  function renderNewsTab(catKey) {
    const content = document.getElementById('news-tab-content');
    if (!content) return;
    const all = getVar('新闻', {});
    const entries = sortedEntries(all[catKey] || {});
    if (!entries.length) {
      content.innerHTML = '<div class="empty-tip">暂无新闻</div>';
      return;
    }
    content.innerHTML = entries.map(([title, n]) => `
      <div class="news-card">
        <div class="news-title">${esc(title)}</div>
        ${n.描述 ? `<div class="news-desc">${esc(n.描述)}</div>` : ''}
        ${n.对应故事线 ? `<div class="news-sl">▸ ${esc(n.对应故事线)}</div>` : ''}
      </div>
    `).join('');
  }

  function repTag(v) {
    if (v >= 75) return { tag: '崇拜', cls: 'pos' };
    if (v >= 40) return { tag: '友好', cls: 'pos' };
    if (v >= 10) return { tag: '友善', cls: 'pos' };
    if (v > -10) return { tag: '中立', cls: 'neu' };
    if (v > -40) return { tag: '冷淡', cls: 'neg' };
    if (v > -75) return { tag: '敌对', cls: 'neg' };
    return { tag: '仇恨', cls: 'neg' };
  }

  function openFactionModal() {
    const body = document.getElementById('faction-body');
    const entries = sortedEntries(getVar('阵营', {}));
    if (!entries.length) {
      body.innerHTML = '<div class="empty-tip">暂无阵营记录</div>';
      document.getElementById('mask-faction').classList.add('show');
      return;
    }
    body.innerHTML = `<div class="faction-grid">${
      entries.map(([name, f]) => {
        const rep = toNum(f.声望, 0);
        const abs = Math.abs(rep);
        const half = Math.min(50, abs / 2);
        const negW = rep < 0 ? half : 0;
        const posW = rep > 0 ? half : 0;
        const { tag, cls } = repTag(rep);
        const numCls = rep > 0 ? 'pos' : (rep < 0 ? 'neg' : 'neu');
        const sign = rep > 0 ? '+' : '';
        return `<div class="faction-card">
          <div class="faction-head">
            <div class="faction-name" title="${esc(name)}">${esc(name)}</div>
            <span class="faction-tag ${cls}">${tag}</span>
          </div>
          <div class="faction-rep-row">
            <div class="bar-track-sym">
              <div class="bar-fill-neg rep-neg" style="width:${negW}%"></div>
              <div class="bar-fill-pos rep-pos" style="width:${posW}%"></div>
            </div>
            <span class="faction-rep-num ${numCls}">${sign}${rep}</span>
          </div>
        </div>`;
      }).join('')
    }</div>`;
    document.getElementById('mask-faction').classList.add('show');
  }

  function bindEvents() {
    document.getElementById('entry-reincarnator').addEventListener('click', openReincarnatorDetail);
    document.getElementById('entry-char').addEventListener('click', openCharList);
    document.getElementById('entry-task').addEventListener('click', openTaskModal);
    document.getElementById('entry-building').addEventListener('click', openBuildingModal);
    document.getElementById('entry-history').addEventListener('click', openHistoryModal);
    document.getElementById('entry-faction').addEventListener('click', openFactionModal);

    // 新闻按钮：事件委托到 worldbar（innerHTML 重渲染也能触发）
    document.getElementById('worldbar').addEventListener('click', e => {
      if (e.target.closest('#news-entry-btn')) openNewsModal();
    });

    document.querySelectorAll('[data-close]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.getElementById(btn.dataset.close).classList.remove('show');
      });
    });
    document.querySelectorAll('.mask').forEach(mask => {
      mask.addEventListener('click', e => {
        if (e.target === mask) mask.classList.remove('show');
      });
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        hideInfoPopover();
        const openMasks = Array.from(document.querySelectorAll('.mask.show'));
        if (openMasks.length) openMasks[openMasks.length - 1].classList.remove('show');
      }
    });
  }

  async function updateUI() {
    const stat = await window.__tower_read();
    if (stat) window.__tower_cached_stat = stat;
    renderWorldbar();
    renderReincarnatorCard();
  }
  window.__towerRefresh = updateUI;

  function init() {
    bindEvents();
    updateUI();

    try {
      if (window.__towerRecalc) {
        window.__towerRecalc().catch(e => console.warn('[tower] initial recalc failed', e));
      }
    } catch(e) { console.warn('[tower] initial recalc failed', e); }

    try {
      const evt = window.Mvu?.events?.VARIABLE_UPDATE_ENDED;
      if (typeof eventOn === 'function' && evt !== undefined) {
        eventOn(evt, () => {
          if (window.__towerRecalc) window.__towerRecalc().catch(() => {});
          updateUI();
        });
      }
    } catch(e) { /* 忽略 */ }

    setInterval(async () => {
      try {
        if (window.__towerRecalc) await window.__towerRecalc();
        await updateUI();
      } catch(e) {}
    }, 1500);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
